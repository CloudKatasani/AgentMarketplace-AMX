# Banking pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: banking
name: Banking
version: 1.0.0
summary: Retail and commercial banking, organised around the customer, the account, and the exposures
  a regulator asks about.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: retail-banking
  name: Retail Banking
- key: commercial-lending
  name: Commercial Lending
- key: risk-and-capital
  name: Risk & Capital
- key: financial-crime
  name: Financial Crime
- key: payments
  name: Payments
conformedBackbone:
- Customer
- Account
- Product
- Transaction
- Exposure
personas:
- key: credit-risk-analyst
  name: Credit Risk Analyst
  kind: BUSINESS
  ownedDecisions: Which exposures are reviewed early and which limits are cut before the quarter closes.
  cadence: Weekly, with a daily watchlist review
  currentWorkaround: Pulls three risk reports and reconciles obligor names by hand.
- key: financial-crime-investigator
  name: Financial Crime Investigator
  kind: BUSINESS
  ownedDecisions: Which alerts are escalated to a suspicious activity report and which are closed.
  cadence: Daily
  currentWorkaround: Works an alert queue with no view of which alert types actually convert.
- key: collections-manager
  name: Collections Manager
  kind: BUSINESS
  ownedDecisions: Which arrears cases get contacted first and which move to forbearance.
  cadence: Daily
  currentWorkaround: Works a queue sorted by balance rather than by likelihood of cure.
- key: payments-operations-lead
  name: Payments Operations Lead
  kind: BUSINESS
  ownedDecisions: When a rail is degraded enough to reroute or pause.
  cadence: Continuous, with a morning review
  currentWorkaround: Watches a dashboard of raw counts with no view of what is normal.
- key: conduct-risk-officer
  name: Conduct Risk Officer
  kind: BUSINESS
  ownedDecisions: Which complaint themes become a remediation programme.
  cadence: Monthly, reported to committee
  currentWorkaround: Reads complaint samples and infers the theme by hand.
- key: deposits-product-owner
  name: Deposits Product Owner
  kind: BUSINESS
  ownedDecisions: Where pricing moves, and which segments are defended.
  cadence: Weekly
  currentWorkaround: Compares balance reports across two systems that disagree.
questionLibrary:
- key: q-exposure-drift
  personaKey: credit-risk-analyst
  text: Which obligors moved into a worse risk grade this month?
  intentClass: trend
  consequenceOfNoAnswer: Limits stay where they were and the loss shows up two quarters later.
  expectedAnswerShape: Obligor list with grade movement and exposure
  metricKey: probability_of_default
- key: q-concentration
  personaKey: credit-risk-analyst
  text: Where is exposure most concentrated relative to appetite?
  intentClass: comparison
  consequenceOfNoAnswer: Concentration is discovered by the regulator rather than by us.
  expectedAnswerShape: Sector and geography breakdown against appetite
  metricKey: exposure_at_default
- key: q-why-downgrade
  personaKey: credit-risk-analyst
  text: Why did the risk grade move for the obligors we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Reviews restate the same numbers without explaining the change.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: probability_of_default
- key: q-alert-quality
  personaKey: financial-crime-investigator
  text: Which alert typologies convert to reports most often?
  intentClass: trend
  consequenceOfNoAnswer: Investigator time goes to the noisiest typology rather than the most productive
    one.
  expectedAnswerShape: Typology list with conversion rate and volume
  metricKey: alert_conversion_rate
- key: q-complaint-volume
  personaKey: conduct-risk-officer
  text: Which products are generating the most complaints?
  intentClass: comparison
  consequenceOfNoAnswer: A product problem is read as a service problem.
  expectedAnswerShape: Product list with complaint volume
  metricKey: complaint_upheld_rate
- key: q-rail-volume
  personaKey: payments-operations-lead
  text: Which rails are carrying the most volume right now?
  intentClass: lookup
  consequenceOfNoAnswer: Capacity decisions are made without knowing where the load is.
  expectedAnswerShape: Rail list with volume and success
  metricKey: payment_success_rate
- key: q-arrears-entry
  personaKey: collections-manager
  text: Which segments are entering arrears fastest?
  intentClass: trend
  consequenceOfNoAnswer: Early-stage arrears grows before anyone re-plans capacity.
  expectedAnswerShape: Segment trend with entry rate
  metricKey: arrears_rate_30dpd
- key: q-arrears-priority
  personaKey: collections-manager
  text: Which arrears cases are most likely to cure with early contact?
  intentClass: recommendation
  consequenceOfNoAnswer: Effort goes to the largest balances instead of the reachable ones.
  expectedAnswerShape: Ranked case list with cure likelihood
  metricKey: cure_rate
- key: q-arrears-trend
  personaKey: collections-manager
  text: How is thirty-day arrears moving by portfolio?
  intentClass: trend
  consequenceOfNoAnswer: A deteriorating book is spotted at quarter end.
  expectedAnswerShape: Arrears rate trend by portfolio
  metricKey: arrears_rate_30dpd
- key: q-payment-failures
  personaKey: payments-operations-lead
  text: Which payment rail is failing more than usual today?
  intentClass: diagnosis
  consequenceOfNoAnswer: Customers report the outage before operations sees it.
  expectedAnswerShape: Rail comparison against baseline
  metricKey: payment_success_rate
- key: q-settlement-latency
  personaKey: payments-operations-lead
  text: Where has settlement latency moved outside its normal range?
  intentClass: comparison
  consequenceOfNoAnswer: Slow settlement is absorbed as complaints instead of fixed.
  expectedAnswerShape: Latency by rail with baseline band
  metricKey: settlement_latency
- key: q-complaint-themes
  personaKey: conduct-risk-officer
  text: Which complaint themes are being upheld most often?
  intentClass: trend
  consequenceOfNoAnswer: Remediation starts after the regulator asks rather than before.
  expectedAnswerShape: Theme list with uphold rate and volume
  metricKey: complaint_upheld_rate
- key: q-remediation-late
  personaKey: conduct-risk-officer
  text: Which remediation actions are past their committed date?
  intentClass: lookup
  consequenceOfNoAnswer: Committee is told everything is on track until it is not.
  expectedAnswerShape: Action list with owner and days overdue
  metricKey: remediation_backlog
- key: q-deposit-growth
  personaKey: deposits-product-owner
  text: Which segments are growing or draining deposits this month?
  intentClass: trend
  consequenceOfNoAnswer: Pricing responds to last quarter's picture.
  expectedAnswerShape: Segment growth with balance movement
  metricKey: deposit_balance_growth
- key: q-deposit-attrition
  personaKey: deposits-product-owner
  text: Where is deposit attrition concentrated?
  intentClass: comparison
  consequenceOfNoAnswer: Retention spend lands on segments that were never leaving.
  expectedAnswerShape: Attrition by segment and tenure
  metricKey: deposit_attrition_rate
- key: q-origination-slow
  personaKey: credit-risk-analyst
  text: Where is the approval cycle slowest, and what is holding it?
  intentClass: diagnosis
  consequenceOfNoAnswer: Deals are lost to a competitor who answered first.
  expectedAnswerShape: Stage timings with bottleneck named
  metricKey: approval_cycle_time
dataProducts:
- key: credit-risk-360
  name: Credit Risk 360
  description: Conformed obligor, facility, and exposure view with certified risk metrics.
  domainKey: risk-and-capital
  owner: Risk Analytics
  contractVersion: 2.3.0
  semanticModelVersion: 2.3.0
  layer: GOLD
  qualityScore: 92
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: probability_of_default
    name: Probability of default
    definition: Modelled twelve-month probability of default for an obligor, calibrated quarterly.
    grain: obligor / month
    unit: percent
    semanticRef: semantic.credit_risk_360.probability_of_default
  - key: exposure_at_default
    name: Exposure at default
    definition: Expected exposure at the point of default, net of eligible collateral.
    grain: facility / month
    unit: currency
    semanticRef: semantic.credit_risk_360.exposure_at_default
- key: financial-crime-signals
  name: Financial Crime Signals
  description: Certified alert, disposition, and typology metrics across monitoring systems.
  domainKey: financial-crime
  owner: Financial Crime Analytics
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 89
  sensitivity: RESTRICTED
  freshnessSlaHours: 24
  metrics:
  - key: alert_conversion_rate
    name: Alert conversion rate
    definition: Share of alerts that become a filed report, by typology and period.
    grain: typology / month
    unit: percent
    semanticRef: semantic.financial_crime_signals.alert_conversion_rate
- key: deposits-and-savings
  name: Deposits & Savings
  description: Certified balance, growth, and attrition metrics across retail deposit products.
  domainKey: retail-banking
  owner: Retail Analytics
  contractVersion: 1.5.0
  semanticModelVersion: 1.5.0
  layer: GOLD
  qualityScore: 93
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: deposit_balance_growth
    name: Deposit balance growth
    definition: Net change in deposit balances for a segment, excluding internal transfers.
    grain: segment / month
    unit: percent
    semanticRef: semantic.deposits_and_savings.deposit_balance_growth
  - key: deposit_attrition_rate
    name: Deposit attrition rate
    definition: Share of accounts closed or drained below the active threshold in the period.
    grain: segment / month
    unit: percent
    semanticRef: semantic.deposits_and_savings.deposit_attrition_rate
- key: lending-origination
  name: Lending Origination
  description: Application, decision, and drawdown metrics across commercial lending products.
  domainKey: commercial-lending
  owner: Lending Analytics
  contractVersion: 2.1.0
  semanticModelVersion: 2.1.0
  layer: GOLD
  qualityScore: 91
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: approval_cycle_time
    name: Approval cycle time
    definition: Working days from a complete application to a credit decision.
    grain: application / month
    unit: days
    semanticRef: semantic.lending_origination.approval_cycle_time
  - key: origination_volume
    name: Origination volume
    definition: Value of new facilities drawn in the period, by product and segment.
    grain: product / month
    unit: currency
    semanticRef: semantic.lending_origination.origination_volume
  - key: decline_rate
    name: Decline rate
    definition: Share of complete applications declined at credit decision.
    grain: product / month
    unit: percent
    semanticRef: semantic.lending_origination.decline_rate
- key: payments-flows
  name: Payments Flows
  description: Certified volume, success, and settlement-latency metrics across payment rails.
  domainKey: payments
  owner: Payments Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 95
  sensitivity: INTERNAL
  freshnessSlaHours: 4
  metrics:
  - key: payment_success_rate
    name: Payment success rate
    definition: Share of initiated payments that settle without manual intervention.
    grain: rail / day
    unit: percent
    semanticRef: semantic.payments_flows.payment_success_rate
  - key: settlement_latency
    name: Settlement latency
    definition: Median seconds from payment initiation to confirmed settlement.
    grain: rail / day
    unit: seconds
