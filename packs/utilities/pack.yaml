# Utilities & Energy pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: utilities
name: Utilities & Energy
version: 1.0.0
summary: Customer through to Meter, with the eight domains a retail energy business actually organises
  around, and the churn and high-bill thread that runs through the worked example.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: customer-experience
  name: Customer Experience
- key: meter-to-cash
  name: Meter to Cash
- key: network-operations
  name: Network Operations
- key: energy-trading
  name: Energy Trading
- key: field-services
  name: Field Services
- key: asset-management
  name: Asset Management
- key: regulatory-reporting
  name: Regulatory Reporting
- key: sustainability
  name: Sustainability
conformedBackbone:
- Customer
- Account
- Premise
- Service Point
- Meter
personas:
- key: revenue-assurance-analyst
  name: Revenue Assurance Analyst
  kind: BUSINESS
  ownedDecisions: Which residential accounts get a retention offer this cycle, and which billing anomalies
    get investigated before they become complaints.
  cadence: Weekly, with a daily exception review
  currentWorkaround: Exports three dashboards to a spreadsheet every Monday and reconciles them by hand.
- key: field-operations-lead
  name: Field Operations Lead
  kind: BUSINESS
  ownedDecisions: Which crews are dispatched to which outages first, and which jobs can wait.
  cadence: Daily, and continuously during a storm
  currentWorkaround: A whiteboard, the outage map, and three phone calls.
- key: regulatory-reporting-manager
  name: Regulatory Reporting Manager
  kind: BUSINESS
  ownedDecisions: Which figures are signed off for the regulatory submission, and which need a caveat.
  cadence: Quarterly, with a monthly dry run
  currentWorkaround: Chases four teams for numbers and reconciles definitions by email.
- key: data-platform-engineer
  name: Data Platform Engineer
  kind: IT
  ownedDecisions: Which meter-read pipelines are paused and which incidents are escalated.
  cadence: Daily
  currentWorkaround: Reads alert channels and checks read-completeness dashboards manually.
- key: asset-investment-planner
  name: Asset Investment Planner
  kind: BUSINESS
  ownedDecisions: Which assets are replaced this year and which are held for another cycle.
  cadence: Quarterly, against the regulatory settlement
  currentWorkaround: Ranks assets in a spreadsheet from a condition export that is six weeks old.
- key: trading-desk-lead
  name: Trading Desk Lead
  kind: BUSINESS
  ownedDecisions: How much of tomorrow's forecast demand is hedged, and at what price.
  cadence: Daily, before market close
  currentWorkaround: Reconciles position reports against a demand forecast that arrives by email.
- key: sustainability-lead
  name: Sustainability Lead
  kind: BUSINESS
  ownedDecisions: What is published in the annual report, and which reduction claims can be defended.
  cadence: Monthly, with a hard annual deadline
  currentWorkaround: Rebuilds the emissions position from three systems each reporting cycle.
questionLibrary:
- key: q-churn-rising
  personaKey: revenue-assurance-analyst
  text: Which residential segments are churning faster than last quarter?
  intentClass: trend
  consequenceOfNoAnswer: Retention budget goes to the loudest segment rather than the one actually leaving.
  expectedAnswerShape: Ranked segment list with churn rate and change versus prior quarter
  metricKey: residential_churn_rate
- key: q-high-bill
  personaKey: revenue-assurance-analyst
  text: Which accounts are at risk of a high bill next cycle?
  intentClass: forecast
  consequenceOfNoAnswer: The first the analyst hears about it is the complaint, after the invoice has
    gone out.
  expectedAnswerShape: Account list with risk score and the driver behind it
  metricKey: high_bill_risk
- key: q-why-leaving
  personaKey: revenue-assurance-analyst
  text: Why is churn rising in the accounts we already flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Retention offers are generic, so they are expensive and they do not work.
  expectedAnswerShape: Contributing factors ranked by effect, each traceable to a metric
  metricKey: residential_churn_rate
- key: q-unbilled
  personaKey: revenue-assurance-analyst
  text: How much consumption is recorded but not yet invoiced?
  intentClass: lookup
  consequenceOfNoAnswer: Revenue is recognised late and the cash forecast is wrong.
  expectedAnswerShape: Unbilled revenue by billing cycle with movement since last close
  metricKey: unbilled_revenue
- key: q-worst-feeders
  personaKey: field-operations-lead
  text: Which feeders have the worst interruption duration this month?
  intentClass: comparison
  consequenceOfNoAnswer: Crews are sent where the complaints are loudest rather than where the reliability
    is worst.
  expectedAnswerShape: Feeder list with SAIDI minutes and change versus prior month
  metricKey: saidi_minutes
- key: q-read-completeness
  personaKey: data-platform-engineer
  text: Which meter-read routes are below completeness threshold today?
  intentClass: lookup
  consequenceOfNoAnswer: Estimated bills go out, and the complaints arrive three weeks later.
  expectedAnswerShape: Route list with read completeness against threshold
  metricKey: read_completeness
- key: q-hedge-trend
  personaKey: trading-desk-lead
  text: How has hedge coverage moved across the last month?
  intentClass: trend
  consequenceOfNoAnswer: A drifting hedge position is noticed at settlement.
  expectedAnswerShape: Coverage trend by delivery period
  metricKey: hedge_coverage_ratio
- key: q-asset-criticality
  personaKey: asset-investment-planner
  text: Which critical assets are in the worst condition right now?
  intentClass: lookup
  consequenceOfNoAnswer: A critical asset fails before it reaches a replacement list.
  expectedAnswerShape: Asset list with health and criticality
  metricKey: asset_health_index
- key: q-jobs-missed
  personaKey: field-operations-lead
  text: Which jobs missed their appointment window yesterday, and why?
  intentClass: diagnosis
  consequenceOfNoAnswer: The same round gets booked the same way tomorrow.
  expectedAnswerShape: Job list with cause and crew
  metricKey: appointment_adherence
- key: q-first-time-fix
  personaKey: field-operations-lead
  text: Where is first-time fix falling, by patch and job type?
  intentClass: trend
  consequenceOfNoAnswer: Repeat visits absorb capacity nobody planned for.
  expectedAnswerShape: Trend by patch with job type breakdown
  metricKey: first_time_fix_rate
- key: q-attend-time
  personaKey: field-operations-lead
  text: How long are we taking to attend high-priority jobs?
  intentClass: trend
  consequenceOfNoAnswer: Priority jobs quietly become the same as everything else.
  expectedAnswerShape: Median hours by priority and week
  metricKey: mean_time_to_attend
- key: q-asset-replace
  personaKey: asset-investment-planner
  text: Which assets should be replaced first this year?
  intentClass: recommendation
  consequenceOfNoAnswer: Replacement money goes to whatever failed most recently.
  expectedAnswerShape: Ranked asset list with health and criticality
  metricKey: replacement_priority_score
- key: q-asset-decline
  personaKey: asset-investment-planner
  text: Which asset classes are deteriorating fastest?
  intentClass: trend
  consequenceOfNoAnswer: Deterioration is noticed at failure rather than in planning.
  expectedAnswerShape: Health index trend by asset class
  metricKey: asset_health_index
- key: q-hedge-cover
  personaKey: trading-desk-lead
  text: How much of tomorrow's forecast demand is hedged?
  intentClass: lookup
  consequenceOfNoAnswer: The desk goes into delivery exposed without knowing it.
  expectedAnswerShape: Coverage percentage by delivery period
  metricKey: hedge_coverage_ratio
- key: q-imbalance-cost
  personaKey: trading-desk-lead
  text: What did imbalance cost us last week, and where?
  intentClass: diagnosis
  consequenceOfNoAnswer: Forecast error keeps costing money nobody attributes.
  expectedAnswerShape: Cost by settlement period with driver
  metricKey: imbalance_cost
- key: q-submission-late
  personaKey: regulatory-reporting-manager
  text: Which statutory submissions are at risk of missing their deadline?
  intentClass: forecast
  consequenceOfNoAnswer: A missed filing is discovered by the regulator, not by us.
  expectedAnswerShape: Submission list with days to deadline
  metricKey: submission_timeliness_rate
- key: q-emissions-trend
  personaKey: sustainability-lead
  text: How are scope 2 emissions tracking against the reduction plan?
  intentClass: trend
  consequenceOfNoAnswer: The annual claim is assembled from numbers nobody has checked.
  expectedAnswerShape: Monthly emissions against plan
  metricKey: scope_two_emissions
- key: q-renewable-share
  personaKey: sustainability-lead
  text: What share of supplied energy was certified renewable this month?
  intentClass: lookup
  consequenceOfNoAnswer: A published figure ends up resting on an estimate.
  expectedAnswerShape: Percentage by supply region with source
  metricKey: renewable_share
dataProducts:
- key: customer-360
  name: Customer 360
  description: Conformed customer view across accounts, premises, and service points. Serves residential
    retention and billing analytics.
  domainKey: customer-experience
  owner: Retail Analytics
  contractVersion: 2.1.0
  semanticModelVersion: 2.1.0
  layer: GOLD
  qualityScore: 94
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: residential_churn_rate
    name: Residential churn rate
    definition: Share of residential accounts that terminate service in a rolling 90-day window, excluding
      moves within the service territory.
    grain: account / month
    unit: percent
    semanticRef: semantic.customer_360.residential_churn_rate
  - key: high_bill_risk
    name: High-bill risk score
    definition: Modelled likelihood that an account's next invoice exceeds its trailing 12-month average
      by more than 40 percent.
    grain: account / billing cycle
    unit: score 0-1
    semanticRef: semantic.customer_360.high_bill_risk
- key: meter-to-cash
  name: Meter-to-Cash
  description: Certified billing lifecycle metrics from meter read through invoice and payment.
  domainKey: meter-to-cash
  owner: Revenue Operations
  contractVersion: 1.4.2
  semanticModelVersion: 1.4.0
  layer: GOLD
  qualityScore: 88
  sensitivity: INTERNAL
  freshnessSlaHours: 12
  metrics:
  - key: unbilled_revenue
    name: Unbilled revenue
    definition: Consumption recorded but not yet invoiced, at the close of each billing cycle.
    grain: billing cycle
    unit: currency
    semanticRef: semantic.meter_to_cash.unbilled_revenue
  - key: read_completeness
    name: Read completeness
    definition: Share of scheduled meter reads successfully collected for a route in the current cycle.
    grain: route / cycle
    unit: percent
    semanticRef: semantic.meter_to_cash.read_completeness
- key: network-reliability
  name: Network Reliability
  description: Certified outage, restoration, and reliability metrics by feeder and premise.
  domainKey: network-operations
  owner: Network Operations
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 91
  sensitivity: INTERNAL
  freshnessSlaHours: 6
  metrics:
  - key: saidi_minutes
    name: SAIDI
    definition: Average interruption duration per customer served, in minutes, over the reporting period.
    grain: feeder / month
    unit: minutes
    semanticRef: semantic.network_reliability.saidi_minutes
- key: field-service-operations
  name: Field Service Operations
  description: Certified job, appointment, and crew metrics across planned and reactive field work.
  domainKey: field-services
  owner: Field Operations Analytics
  contractVersion: 1.4.0
  semanticModelVersion: 1.4.0
  layer: GOLD
  qualityScore: 88
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: first_time_fix_rate
    name: First-time fix rate
    definition: Share of field jobs resolved on the first visit, excluding jobs abandoned for access.
    grain: job / month
    unit: percent
    semanticRef: semantic.field_service_operations.first_time_fix_rate
  - key: appointment_adherence
    name: Appointment adherence
    definition: Share of booked appointments met inside the promised window.
    grain: appointment / week
    unit: percent
    semanticRef: semantic.field_service_operations.appointment_adherence
  - key: mean_time_to_attend
    name: Mean time to attend
    definition: Average hours from job creation to a crew arriving on site.
    grain: job / month
    unit: hours
    semanticRef: semantic.field_service_operations.mean_time_to_attend
- key: asset-health-register
  name: Asset Health Register
  description: Condition, criticality, and replacement priority for network assets, certified against the asset register.
  domainKey: asset-management
  owner: Asset Strategy
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 91
  sensitivity: INTERNAL
  freshnessSlaHours: 168
  metrics:
  - key: asset_health_index
    name: Asset health index
    definition: Composite condition score from inspection, age, and failure history, 0 to 100.
    grain: asset / quarter
    unit: index
    semanticRef: semantic.asset_health_register.asset_health_index
  - key: replacement_priority_score
    name: Replacement priority score
    definition: Ranking of assets for replacement, combining health index with criticality.
    grain: asset / quarter
    unit: index
    semanticRef: semantic.asset_health_register.replacement_priority_score
- key: energy-trading-positions
  name: Energy Trading Positions
  description: Certified hedge, imbalance, and position metrics for the wholesale energy book.
  domainKey: energy-trading
  owner: Trading Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 94
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 4
  metrics:
  - key: hedge_coverage_ratio
    name: Hedge coverage ratio
    definition: Share of forecast demand covered by executed hedges for the delivery period.
    grain: delivery period / day
    unit: percent
    semanticRef: semantic.energy_trading_positions.hedge_coverage_ratio
  - key: imbalance_cost
    name: Imbalance cost
    definition: Cost of settlement imbalance between forecast and metered volume.
    grain: settlement period / day
    unit: currency
    semanticRef: semantic.energy_trading_positions.imbalance_cost
- key: regulatory-submissions
  name: Regulatory Submissions
  description: Timeliness and quality of statutory submissions, with the exceptions raised against each.
  domainKey: regulatory-reporting
  owner: Regulatory Reporting
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 96
  sensitivity: INTERNAL
  freshnessSlaHours: 72
  metrics:
  - key: submission_timeliness_rate
    name: Submission timeliness rate
    definition: Share of statutory submissions filed on or before the regulatory deadline.
    grain: submission / quarter
    unit: percent
    semanticRef: semantic.regulatory_submissions.submission_timeliness_rate
  - key: data_quality_exceptions
    name: Data quality exceptions
    definition: Count of validation exceptions raised against a submission before filing.
    grain: submission / quarter
    unit: count
    semanticRef: semantic.regulatory_submissions.data_quality_exceptions
- key: sustainability-emissions
  name: Sustainability & Emissions
  description: Certified emissions, renewable share, and network loss metrics used in public reporting.
  domainKey: sustainability
  owner: Sustainability Reporting
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 87
  sensitivity: INTERNAL
  freshnessSlaHours: 720
  metrics:
  - key: scope_two_emissions
    name: Scope 2 emissions
    definition: Market-based emissions from purchased electricity for network operations.
    grain: reporting entity / month
    unit: tonnes CO2e
    semanticRef: semantic.sustainability_emissions.scope_two_emissions
  - key: renewable_share
    name: Renewable share
    definition: Share of supplied energy from certified renewable generation.
    grain: supply region / month
    unit: percent
    semanticRef: semantic.sustainability_emissions.renewable_share
  - key: network_losses
    name: Network losses
    definition: Energy entering the network that is not billed to a customer, as a share of throughput.
    grain: network area / month
    unit: percent
    semanticRef: semantic.sustainability_emissions.network_losses
- key: outage-communications
  name: Outage Communications
  description: How quickly and how well customers were told about interruptions, by channel and event.
  domainKey: customer-experience
  owner: Customer Operations
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 85
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: notification_latency
    name: Notification latency
    definition: Minutes from outage confirmation to the first customer notification going out.
    grain: outage event
    unit: minutes
    semanticRef: semantic.outage_communications.notification_latency
  - key: proactive_contact_rate
    name: Proactive contact rate
    definition: Share of affected customers contacted before they contacted the utility.
    grain: outage event
    unit: percent
    semanticRef: semantic.outage_communications.proactive_contact_rate
- key: connections-and-capacity
  name: Connections & Capacity
  description: New connection lead times and available network headroom by substation and feeder.
  domainKey: network-operations
  owner: Network Planning
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 90
  sensitivity: INTERNAL
  freshnessSlaHours: 168
  metrics:
  - key: connection_lead_time
    name: Connection lead time
    definition: Working days from a complete connection application to energisation.
    grain: connection / month
    unit: days
    semanticRef: semantic.connections_and_capacity.connection_lead_time
  - key: capacity_headroom
    name: Capacity headroom
    definition: Spare firm capacity at a substation as a share of its rating.
    grain: substation / month
    unit: percent
    semanticRef: semantic.connections_and_capacity.capacity_headroom
