# Insurance pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: insurance
name: Insurance
version: 1.0.0
summary: Policy, claim, and exposure, organised around the underwriting and claims decisions people actually
  own.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: underwriting
  name: Underwriting
- key: claims
  name: Claims
- key: actuarial
  name: Actuarial
- key: distribution
  name: Distribution
- key: fraud
  name: Fraud
conformedBackbone:
- Party
- Policy
- Risk Object
- Claim
- Coverage
personas:
- key: claims-team-lead
  name: Claims Team Lead
  kind: BUSINESS
  ownedDecisions: Which claims are fast-tracked, which are investigated, and where the reserve is set.
  cadence: Daily
  currentWorkaround: Reads a claims queue ordered by age rather than by risk.
- key: underwriting-manager
  name: Underwriting Manager
  kind: BUSINESS
  ownedDecisions: Which risks are accepted, loaded, or declined, and where the guidelines need changing.
  cadence: Weekly
  currentWorkaround: Samples bound policies and compares them to guidelines by hand.
- key: fraud-investigations-lead
  name: Fraud Investigations Lead
  kind: BUSINESS
  ownedDecisions: Which claims are referred to investigation and which are released.
  cadence: Daily
  currentWorkaround: Reviews a referral queue with no view of which referral types pay off.
- key: pricing-actuary
  name: Pricing Actuary
  kind: BUSINESS
  ownedDecisions: Where rate is adequate and where it is corrected at renewal.
  cadence: Monthly
  currentWorkaround: Reruns a rate adequacy model against extracts that arrive late.
- key: distribution-manager
  name: Distribution Manager
  kind: BUSINESS
  ownedDecisions: Which brokers get support, and where new business appetite goes.
  cadence: Weekly
  currentWorkaround: Reads separate broker reports and reconciles names by hand.
- key: retention-lead
  name: Retention Lead
  kind: BUSINESS
  ownedDecisions: Which renewals get intervention and at what price.
  cadence: Weekly
  currentWorkaround: Works a lapse list produced after the renewal invitation has gone out.
questionLibrary:
- key: q-severity-trend
  personaKey: claims-team-lead
  text: Which perils are seeing severity rise fastest?
  intentClass: trend
  consequenceOfNoAnswer: Reserves are set on last year's assumptions and strengthen late.
  expectedAnswerShape: Peril list with severity and change versus prior period
  metricKey: average_claim_severity
- key: q-cycle-outliers
  personaKey: claims-team-lead
  text: Which claim types are taking longest to settle?
  intentClass: comparison
  consequenceOfNoAnswer: Complaints and interest costs both rise before anyone notices.
  expectedAnswerShape: Claim types with cycle time against target
  metricKey: claim_cycle_time
- key: q-why-severity
  personaKey: claims-team-lead
  text: Why has severity risen in the perils we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Remediation is generic and the trend continues.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: average_claim_severity
- key: q-loss-ratio
  personaKey: underwriting-manager
  text: Which segments have a loss ratio outside appetite?
  intentClass: comparison
  consequenceOfNoAnswer: Unprofitable business is renewed for another year.
  expectedAnswerShape: Segment list with loss ratio against appetite
  metricKey: loss_ratio
- key: q-channel-mix
  personaKey: distribution-manager
  text: How is new business split across channels this quarter?
  intentClass: lookup
  consequenceOfNoAnswer: Channel investment follows habit rather than mix.
  expectedAnswerShape: Channel split with conversion
  metricKey: new_business_conversion
- key: q-rate-trend
  personaKey: pricing-actuary
  text: How has rate adequacy moved since the last review?
  intentClass: trend
  consequenceOfNoAnswer: Adequacy erodes quietly between annual reviews.
  expectedAnswerShape: Adequacy trend by segment
  metricKey: rate_adequacy
- key: q-referral-outcome
  personaKey: fraud-investigations-lead
  text: How long are investigations taking to reach an outcome?
  intentClass: trend
  consequenceOfNoAnswer: Cases age in the queue and the claim pays anyway.
  expectedAnswerShape: Outcome time by referral type
  metricKey: referral_rate
- key: q-referral-value
  personaKey: fraud-investigations-lead
  text: Which referral types are actually converting to a save?
  intentClass: comparison
  consequenceOfNoAnswer: Investigation capacity is spent on referral types that never pay.
  expectedAnswerShape: Referral type list with save ratio
  metricKey: fraud_save_ratio
- key: q-referral-volume
  personaKey: fraud-investigations-lead
  text: Where is referral volume rising fastest?
  intentClass: trend
  consequenceOfNoAnswer: A new fraud pattern is seen only once it is expensive.
  expectedAnswerShape: Referral rate trend by product
  metricKey: referral_rate
- key: q-rate-adequacy
  personaKey: pricing-actuary
  text: Which segments are charging below technical price?
  intentClass: comparison
  consequenceOfNoAnswer: Loss-making segments grow because they are the easiest to win.
  expectedAnswerShape: Segment list with adequacy ratio
  metricKey: rate_adequacy
- key: q-quote-conversion
  personaKey: pricing-actuary
  text: Where is quote-to-bind falling after a rate change?
  intentClass: diagnosis
  consequenceOfNoAnswer: A rate correction quietly costs more volume than it was worth.
  expectedAnswerShape: Segment conversion before and after
  metricKey: quote_to_bind_ratio
- key: q-broker-retention
  personaKey: distribution-manager
  text: Which brokers have stopped producing?
  intentClass: lookup
  consequenceOfNoAnswer: A broker relationship is discovered lost at the annual review.
  expectedAnswerShape: Broker list with last production date
  metricKey: broker_retention_rate
- key: q-new-business
  personaKey: distribution-manager
  text: Where is new business converting best this quarter?
  intentClass: comparison
  consequenceOfNoAnswer: Appetite is directed by anecdote from the last conversation.
  expectedAnswerShape: Channel and product conversion
  metricKey: new_business_conversion
- key: q-lapse-risk
  personaKey: retention-lead
  text: Which renewals are most likely to lapse next month?
  intentClass: forecast
  consequenceOfNoAnswer: Intervention arrives after the customer has already left.
  expectedAnswerShape: Policy list with lapse likelihood
  metricKey: policy_lapse_rate
- key: q-renewal-uplift
  personaKey: retention-lead
  text: How much uplift are we applying to retained policies?
  intentClass: trend
  consequenceOfNoAnswer: Retention is bought with margin nobody measured.
  expectedAnswerShape: Uplift trend by product
  metricKey: renewal_premium_uplift
- key: q-repair-cycle
  personaKey: claims-team-lead
  text: Which repairers are slowest to close a claim?
  intentClass: comparison
  consequenceOfNoAnswer: Cycle time is blamed on volume rather than on the network.
  expectedAnswerShape: Supplier list with cycle time
  metricKey: repair_cycle_time
dataProducts:
- key: claims-360
  name: Claims 360
  description: Conformed claim, policy, and coverage view with certified severity and cycle-time metrics.
  domainKey: claims
  owner: Claims Analytics
  contractVersion: 1.5.0
  semanticModelVersion: 1.5.0
  layer: GOLD
  qualityScore: 90
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: average_claim_severity
    name: Average claim severity
    definition: Mean incurred cost per settled claim, by peril and period.
    grain: peril / month
    unit: currency
    semanticRef: semantic.claims_360.average_claim_severity
  - key: claim_cycle_time
    name: Claim cycle time
    definition: Median days from first notification of loss to settlement.
    grain: peril / month
    unit: days
    semanticRef: semantic.claims_360.claim_cycle_time
- key: underwriting-portfolio
  name: Underwriting Portfolio
  description: Certified exposure, loss ratio, and rate adequacy metrics across the book.
  domainKey: underwriting
  owner: Actuarial
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 91
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: loss_ratio
    name: Loss ratio
    definition: Incurred losses divided by earned premium for a segment and period.
    grain: segment / quarter
    unit: percent
    semanticRef: semantic.underwriting_portfolio.loss_ratio
- key: fraud-signals
  name: Fraud Signals
  description: Referral, investigation, and recovery metrics from the special investigations unit.
  domainKey: fraud
  owner: Counter-Fraud Analytics
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 90
  sensitivity: RESTRICTED
  freshnessSlaHours: 24
  metrics:
  - key: referral_rate
    name: Referral rate
    definition: Share of claims referred for investigation, by product and channel.
    grain: product / month
    unit: percent
    semanticRef: semantic.fraud_signals.referral_rate
  - key: fraud_save_ratio
    name: Fraud save ratio
    definition: Value of prevented or recovered indemnity over investigation cost.
    grain: product / quarter
    unit: ratio
    semanticRef: semantic.fraud_signals.fraud_save_ratio
- key: reserving-and-actuarial
  name: Reserving & Actuarial
  description: Certified reserve, development, and ultimate-loss metrics used in actuarial review.
  domainKey: actuarial
  owner: Actuarial Reporting
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 95
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 168
  metrics:
  - key: ibnr_reserve
    name: IBNR reserve
    definition: Reserve held for claims incurred but not yet reported, by class.
    grain: class / quarter
    unit: currency
    semanticRef: semantic.reserving_and_actuarial.ibnr_reserve
  - key: loss_development_factor
    name: Loss development factor
    definition: Ratio of ultimate to reported losses at a given development age.
    grain: class / quarter
    unit: ratio
    semanticRef: semantic.reserving_and_actuarial.loss_development_factor
- key: distribution-performance
  name: Distribution Performance
  description: Broker, agency, and direct channel metrics for new business and retention.
  domainKey: distribution
  owner: Distribution Analytics
  contractVersion: 1.4.0
  semanticModelVersion: 1.4.0
  layer: GOLD
  qualityScore: 88
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: new_business_conversion
    name: New business conversion
    definition: Share of quotes that bind, by channel and product.
    grain: channel / month
    unit: percent
    semanticRef: semantic.distribution_performance.new_business_conversion
  - key: broker_retention_rate
    name: Broker retention rate
    definition: Share of producing brokers still producing twelve months later.
    grain: region / quarter
    unit: percent
    semanticRef: semantic.distribution_performance.broker_retention_rate
- key: pricing-and-rating
  name: Pricing & Rating
  description: Rate adequacy and quote behaviour metrics used in underwriting review.
  domainKey: underwriting
  owner: Pricing Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 91
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: rate_adequacy
    name: Rate adequacy
    definition: Charged premium over technical price for the same risk.
    grain: segment / quarter
    unit: ratio
    semanticRef: semantic.pricing_and_rating.rate_adequacy
  - key: quote_to_bind_ratio
    name: Quote to bind ratio
    definition: Bound policies over quotes issued, by segment.
    grain: segment / month
    unit: ratio
    semanticRef: semantic.pricing_and_rating.quote_to_bind_ratio
- key: policy-retention
  name: Policy Retention
  description: Lapse, renewal, and mid-term adjustment metrics across the in-force book.
  domainKey: distribution
  owner: Retention Analytics
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: policy_lapse_rate
    name: Policy lapse rate
    definition: Share of policies not renewed at expiry, excluding cancelled-flat policies.
    grain: product / month
    unit: percent
    semanticRef: semantic.policy_retention.policy_lapse_rate
  - key: renewal_premium_uplift
    name: Renewal premium uplift
    definition: Average premium change applied at renewal for retained policies.
    grain: product / month
    unit: percent
    semanticRef: semantic.policy_retention.renewal_premium_uplift
- key: claims-supply-chain
