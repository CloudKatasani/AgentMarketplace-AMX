# Public Sector pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: public-sector
name: Public Sector
version: 1.0.0
summary: Citizen, case, and service, organised around the caseload and outcome decisions public services
  own — with transparency assumed rather than added.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: service-delivery
  name: Service Delivery
- key: casework
  name: Casework
- key: payments-and-benefits
  name: Payments & Benefits
- key: policy-analysis
  name: Policy Analysis
- key: workforce
  name: Workforce
conformedBackbone:
- Citizen
- Case
- Service
- Payment
- Provider
personas:
- key: casework-manager
  name: Casework Manager
  kind: BUSINESS
  ownedDecisions: Which cases are escalated, reassigned, or closed, and where extra caseworkers go.
  cadence: Weekly, with a daily queue review
  currentWorkaround: Reads a caseload report that counts cases but not the reasons they stall.
- key: policy-analyst
  name: Policy Analyst
  kind: BUSINESS
  ownedDecisions: Which policy options are modelled and which evidence is published.
  cadence: Quarterly
  currentWorkaround: Requests bespoke extracts and reconciles definitions across teams.
questionLibrary:
- key: q-backlog
  personaKey: casework-manager
  text: Which case types have the fastest growing backlog?
  intentClass: trend
  consequenceOfNoAnswer: Caseworkers are moved to the queue that shouts loudest.
  expectedAnswerShape: Case type list with backlog and change versus prior period
  metricKey: case_backlog_count
- key: q-resolution
  personaKey: casework-manager
  text: Which case types take longest to resolve?
  intentClass: comparison
  consequenceOfNoAnswer: Citizens wait longest where nobody is measuring.
  expectedAnswerShape: Case type list with resolution time against target
  metricKey: case_resolution_days
- key: q-why-backlog
  personaKey: casework-manager
  text: Why did the backlog grow in the case types we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Extra staff are added and the backlog returns next quarter.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: case_backlog_count
- key: q-equity
  personaKey: policy-analyst
  text: Where are outcomes least equitable across cohorts?
  intentClass: comparison
  consequenceOfNoAnswer: Inequity persists because it is not routinely measured or published.
  expectedAnswerShape: Service list with equity gap and direction
  metricKey: outcome_equity_gap
dataProducts:
- key: casework-360
  name: Casework 360
  description: Conformed citizen, case, and service view with certified caseload and outcome metrics.
  domainKey: casework
  owner: Service Analytics
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 88
  sensitivity: RESTRICTED
  freshnessSlaHours: 24
  metrics:
  - key: case_resolution_days
    name: Case resolution time
    definition: Median days from case opening to a substantive decision.
    grain: case type / month
    unit: days
    semanticRef: semantic.casework_360.case_resolution_days
  - key: case_backlog_count
    name: Case backlog
    definition: Open cases past their target resolution time at the point of measurement.
    grain: case type / week
    unit: count
    semanticRef: semantic.casework_360.case_backlog_count
- key: outcome-signals
  name: Outcome Signals
  description: Certified outcome and equity metrics with published definitions.
  domainKey: policy-analysis
  owner: Policy Analytics
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 86
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: outcome_equity_gap
    name: Outcome equity gap
    definition: Difference in outcome rate between the best and worst served cohort for a service.
    grain: service / quarter
    unit: percentage points
    semanticRef: semantic.outcome_signals.outcome_equity_gap
- key: benefit-payments
