  description: Test turnaround and backlog metrics across imaging and pathology.
  domainKey: patient-flow
  owner: Diagnostics Analytics
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: test_turnaround_time
