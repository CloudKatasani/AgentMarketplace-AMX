# Healthcare pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: healthcare
name: Healthcare
version: 1.0.0
summary: Patient, encounter, and pathway, organised around the operational decisions clinicians and managers
  own — not around clinical decision-making.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: patient-flow
  name: Patient Flow
- key: quality-and-safety
  name: Quality & Safety
- key: workforce
  name: Workforce
- key: revenue-cycle
  name: Revenue Cycle
- key: population-health
  name: Population Health
conformedBackbone:
- Patient
- Encounter
- Provider
- Pathway
- Order
personas:
- key: service-manager
  name: Service Manager
  kind: BUSINESS
  ownedDecisions: Which clinics get extra capacity and which pathways are escalated.
  cadence: Weekly, with a daily operational huddle
  currentWorkaround: Reads three reports with different definitions of a breach.
- key: quality-lead
  name: Quality Lead
  kind: BUSINESS
  ownedDecisions: Which incidents are investigated and which improvement work is prioritised.
  cadence: Monthly
  currentWorkaround: Waits for the safety report and asks for cuts of it by hand.
questionLibrary:
- key: q-wait-trend
  personaKey: service-manager
  text: Which pathways have waits growing fastest?
  intentClass: trend
  consequenceOfNoAnswer: Capacity goes to the loudest specialty rather than the one deteriorating.
  expectedAnswerShape: Pathway list with wait and change versus prior period
  metricKey: pathway_wait_days
- key: q-capacity
  personaKey: service-manager
  text: Which clinics have the most unused capacity?
  intentClass: comparison
  consequenceOfNoAnswer: Slots are wasted while waits grow elsewhere.
  expectedAnswerShape: Clinic list with utilisation against target
  metricKey: clinic_utilisation
- key: q-why-waits
  personaKey: service-manager
  text: Why did waits grow on the pathways we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Actions are generic and the wait keeps growing.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: pathway_wait_days
- key: q-readmissions
  personaKey: quality-lead
  text: Which specialties have readmission rates above expectation?
  intentClass: comparison
  consequenceOfNoAnswer: Improvement work goes where it is easiest rather than where harm is.
  expectedAnswerShape: Specialty list with readmission rate against expectation
  metricKey: readmission_rate
dataProducts:
- key: patient-flow-360
  name: Patient Flow 360
  description: Conformed patient, encounter, and pathway view with certified waiting and capacity metrics.
  domainKey: patient-flow
  owner: Operational Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 90
  sensitivity: RESTRICTED
  freshnessSlaHours: 24
  metrics:
  - key: pathway_wait_days
    name: Pathway wait
    definition: Median days from referral to first definitive treatment on a pathway.
    grain: pathway / week
    unit: days
    semanticRef: semantic.patient_flow_360.pathway_wait_days
  - key: clinic_utilisation
    name: Clinic utilisation
    definition: Share of offered clinic slots used, net of cancellations.
    grain: clinic / week
    unit: percent
    semanticRef: semantic.patient_flow_360.clinic_utilisation
- key: quality-signals
  name: Quality Signals
  description: Certified incident, harm, and readmission metrics with agreed definitions.
  domainKey: quality-and-safety
  owner: Quality Analytics
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 88
  sensitivity: RESTRICTED
  freshnessSlaHours: 24
  metrics:
  - key: readmission_rate
    name: Readmission rate
    definition: Share of discharges readmitted within thirty days for a related cause.
    grain: specialty / month
    unit: percent
    semanticRef: semantic.quality_signals.readmission_rate
- key: revenue-cycle-360
  name: Revenue Cycle 360
  description: Certified billing, denial, and collection metrics from encounter through payment.
  domainKey: revenue-cycle
  owner: Revenue Cycle Analytics
  contractVersion: 2.2.0
  semanticModelVersion: 2.2.0
  layer: GOLD
  qualityScore: 92
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: denial_rate
    name: Denial rate
    definition: Share of submitted claims denied on first pass, by payer and service line.
    grain: payer / month
    unit: percent
    semanticRef: semantic.revenue_cycle_360.denial_rate
  - key: days_in_ar
    name: Days in accounts receivable
    definition: Average days from claim submission to cash posting.
    grain: service line / month
    unit: days
    semanticRef: semantic.revenue_cycle_360.days_in_ar
- key: workforce-rostering
  name: Workforce & Rostering
  description: Staffing, agency use, and vacancy metrics across clinical rosters.
  domainKey: workforce
  owner: Workforce Analytics
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
