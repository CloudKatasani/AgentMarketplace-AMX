# Retail & CPG pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: retail-cpg
name: Retail & CPG
version: 1.0.0
summary: Product, store, and shopper, organised around the availability and margin decisions that run
  a trading week.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: merchandising
  name: Merchandising
- key: supply-chain
  name: Supply Chain
- key: store-operations
  name: Store Operations
- key: ecommerce
  name: eCommerce
- key: customer-loyalty
  name: Customer Loyalty
conformedBackbone:
- Product
- Store
- Customer
- Order
- Supplier
personas:
- key: category-manager
  name: Category Manager
  kind: BUSINESS
  ownedDecisions: Which lines are ranged, promoted, or delisted for the coming period.
  cadence: Weekly, with a monthly range review
  currentWorkaround: Downloads sales and stock reports and pivots them by hand.
- key: supply-planner
  name: Supply Planner
  kind: BUSINESS
  ownedDecisions: Which orders are expedited and which allocations are cut.
  cadence: Daily
  currentWorkaround: Works from an exception report that does not explain the cause.
- key: store-operations-manager
  name: Store Operations Manager
  kind: BUSINESS
  ownedDecisions: Where hours are added or cut across the estate each week.
  cadence: Weekly
  currentWorkaround: Compares labour reports with sales exports that arrive on different days.
- key: ecommerce-manager
  name: Ecommerce Manager
  kind: BUSINESS
  ownedDecisions: Which journey fixes and campaigns go live next.
  cadence: Daily
  currentWorkaround: Watches a funnel dashboard with no view of what changed upstream.
- key: loyalty-manager
  name: Loyalty Manager
  kind: BUSINESS
  ownedDecisions: Which segments get an offer and what it costs.
  cadence: Weekly
  currentWorkaround: Builds segments from an export that is a week stale.
- key: fulfilment-manager
  name: Fulfilment Manager
  kind: BUSINESS
  ownedDecisions: Where capacity is added and which carrier is used.
  cadence: Daily
  currentWorkaround: Reads carrier reports separately from the order book.
questionLibrary:
- key: q-availability
  personaKey: category-manager
  text: Which lines lost the most availability this week?
  intentClass: trend
  consequenceOfNoAnswer: Lost sales are attributed to demand rather than to a gap on the shelf.
  expectedAnswerShape: Product list with availability and change versus prior week
  metricKey: on_shelf_availability
- key: q-margin-mix
  personaKey: category-manager
  text: Which lines are growing volume but losing margin?
  intentClass: comparison
  consequenceOfNoAnswer: The category grows and the profit does not.
  expectedAnswerShape: Product list with volume growth against margin rate
  metricKey: gross_margin_rate
- key: q-why-gaps
  personaKey: category-manager
  text: Why did availability drop on the lines we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: The same gaps reappear next week because the cause was never named.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: on_shelf_availability
- key: q-supplier-risk
  personaKey: supply-planner
  text: Which suppliers are missing fill rate targets?
  intentClass: lookup
  consequenceOfNoAnswer: Allocations are cut across the board rather than where the shortfall is.
  expectedAnswerShape: Supplier list with fill rate against target
  metricKey: supplier_fill_rate
- key: q-lane-cost-trend
  personaKey: fulfilment-manager
  text: How is cost per order trending by lane?
  intentClass: trend
  consequenceOfNoAnswer: Cost creeps up lane by lane between reviews.
  expectedAnswerShape: Lane trend with cost per order
  metricKey: cost_per_order
- key: q-device-conversion
  personaKey: ecommerce-manager
  text: Where does conversion differ most by device?
  intentClass: comparison
  consequenceOfNoAnswer: A mobile-only failure hides inside a healthy total.
  expectedAnswerShape: Device comparison with conversion
  metricKey: conversion_rate
- key: q-store-trend
  personaKey: store-operations-manager
  text: How is labour productivity trending by format?
  intentClass: trend
  consequenceOfNoAnswer: Productivity slips seasonally and is read as noise.
  expectedAnswerShape: Format trend with hours per sale
  metricKey: labour_hours_per_sale
- key: q-labour-productivity
  personaKey: store-operations-manager
  text: Which stores are using the most hours per sale?
  intentClass: comparison
  consequenceOfNoAnswer: Hours are cut evenly rather than where they are unproductive.
  expectedAnswerShape: Store list with hours per sale
  metricKey: labour_hours_per_sale
- key: q-shrink-hotspots
  personaKey: store-operations-manager
  text: Where is shrink concentrated this period?
  intentClass: lookup
  consequenceOfNoAnswer: Shrink is treated as a cost of trading rather than a location problem.
  expectedAnswerShape: Store and category with shrink rate
  metricKey: shrink_rate
- key: q-conversion-drop
  personaKey: ecommerce-manager
  text: Where did conversion drop after the last release?
  intentClass: diagnosis
  consequenceOfNoAnswer: A broken step stays live because the total looks normal.
  expectedAnswerShape: Step conversion before and after
  metricKey: conversion_rate
- key: q-abandonment
  personaKey: ecommerce-manager
  text: Which baskets are being abandoned most, and at which step?
  intentClass: diagnosis
  consequenceOfNoAnswer: Abandonment is answered with discounts instead of fixes.
  expectedAnswerShape: Step list with abandonment rate
  metricKey: basket_abandonment_rate
- key: q-repeat-purchase
  personaKey: loyalty-manager
  text: Which segments are buying again within ninety days?
  intentClass: trend
  consequenceOfNoAnswer: Offers go to segments that would have returned anyway.
  expectedAnswerShape: Segment trend with repeat rate
  metricKey: repeat_purchase_rate
- key: q-loyalty-penetration
  personaKey: loyalty-manager
  text: Where is loyalty identification weakest?
  intentClass: comparison
  consequenceOfNoAnswer: Half the basket data is missing and nobody says which half.
  expectedAnswerShape: Store list with identified share
  metricKey: loyalty_penetration
- key: q-delivery-late
  personaKey: fulfilment-manager
  text: Which lanes are missing the promised delivery slot?
  intentClass: lookup
  consequenceOfNoAnswer: A carrier problem is discovered through customer contact.
  expectedAnswerShape: Lane list with on-time rate
  metricKey: on_time_delivery
- key: q-cost-per-order
  personaKey: fulfilment-manager
  text: Where is cost per order highest, and what is driving it?
  intentClass: diagnosis
  consequenceOfNoAnswer: Fulfilment cost is managed as one number for the whole network.
  expectedAnswerShape: Node list with cost and driver
  metricKey: cost_per_order
- key: q-promo-roi
  personaKey: category-manager
  text: Which promotions actually returned their investment?
  intentClass: comparison
  consequenceOfNoAnswer: The same mechanic is repeated because it felt busy.
  expectedAnswerShape: Campaign list with ROI
  metricKey: promotion_roi
dataProducts:
- key: product-performance
  name: Product Performance
  description: Conformed product, store, and sales view with certified availability and margin metrics.
  domainKey: merchandising
  owner: Commercial Analytics
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: on_shelf_availability
    name: On-shelf availability
    definition: Share of store-product-days where the line was available to buy.
    grain: product / store / day
    unit: percent
    semanticRef: semantic.product_performance.on_shelf_availability
  - key: gross_margin_rate
    name: Gross margin rate
    definition: Gross margin as a share of net sales for a product and period.
    grain: product / week
    unit: percent
    semanticRef: semantic.product_performance.gross_margin_rate
- key: supply-signals
  name: Supply Signals
  description: Certified inbound, lead time, and fill rate metrics across suppliers.
  domainKey: supply-chain
  owner: Supply Chain Analytics
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 87
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: supplier_fill_rate
    name: Supplier fill rate
    definition: Share of ordered units delivered in full and on time by a supplier.
    grain: supplier / week
    unit: percent
    semanticRef: semantic.supply_signals.supplier_fill_rate
- key: store-operations-360
  name: Store Operations 360
  description: Labour, shrink, and execution metrics across the store estate.
  domainKey: store-operations
  owner: Store Operations Analytics
  contractVersion: 1.4.0
  semanticModelVersion: 1.4.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: labour_hours_per_sale
    name: Labour hours per sale
    definition: Rostered hours per thousand units sold, by store format.
    grain: store / week
    unit: hours
    semanticRef: semantic.store_operations_360.labour_hours_per_sale
  - key: shrink_rate
    name: Shrink rate
    definition: Unaccounted stock loss as a share of retail value.
    grain: store / month
    unit: percent
    semanticRef: semantic.store_operations_360.shrink_rate
- key: ecommerce-funnel
  name: Ecommerce Funnel
  description: Traffic, conversion, and basket metrics across digital storefronts.
  domainKey: ecommerce
  owner: Digital Commerce Analytics
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 91
  sensitivity: INTERNAL
  freshnessSlaHours: 6
  metrics:
  - key: conversion_rate
    name: Conversion rate
    definition: Sessions ending in a completed order, as a share of sessions.
    grain: channel / day
    unit: percent
    semanticRef: semantic.ecommerce_funnel.conversion_rate
  - key: basket_abandonment_rate
    name: Basket abandonment rate
    definition: Baskets created but not converted within the session window.
    grain: channel / day
    unit: percent
    semanticRef: semantic.ecommerce_funnel.basket_abandonment_rate
- key: loyalty-and-crm
  name: Loyalty & CRM
  description: Membership, repeat purchase, and campaign response metrics.
  domainKey: customer-loyalty
  owner: Customer Analytics
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 88
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: repeat_purchase_rate
    name: Repeat purchase rate
    definition: Share of members purchasing again within ninety days.
    grain: segment / month
    unit: percent
    semanticRef: semantic.loyalty_and_crm.repeat_purchase_rate
  - key: loyalty_penetration
    name: Loyalty penetration
    definition: Share of sales identified to a loyalty member.
    grain: store / month
    unit: percent
    semanticRef: semantic.loyalty_and_crm.loyalty_penetration
- key: pricing-and-promotions
  name: Pricing & Promotions
  description: Promotional lift, funding, and margin impact by mechanic and category.
  domainKey: merchandising
  owner: Pricing Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 87
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: promotion_roi
    name: Promotion ROI
    definition: Incremental margin over promotional investment for a mechanic.
    grain: campaign
    unit: ratio
    semanticRef: semantic.pricing_and_promotions.promotion_roi
  - key: price_index
    name: Price index
    definition: Basket price relative to the named competitor set.
    grain: category / week
    unit: index
    semanticRef: semantic.pricing_and_promotions.price_index
- key: assortment-and-space
  name: Assortment & Space
  description: Range productivity and space allocation metrics by category and format.
  domainKey: merchandising
  owner: Category Management
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 86
  sensitivity: INTERNAL
  freshnessSlaHours: 168
  metrics:
  - key: range_productivity
    name: Range productivity
    definition: Sales per linear metre of shelf, by category and format.
    grain: category / month
    unit: currency
    semanticRef: semantic.assortment_and_space.range_productivity
  - key: sku_rationalisation_rate
    name: SKU rationalisation rate
    definition: Share of listed SKUs contributing below the tail threshold.
    grain: category / quarter
    unit: percent
    semanticRef: semantic.assortment_and_space.sku_rationalisation_rate
- key: fulfilment-and-delivery
  name: Fulfilment & Delivery
  description: Pick, pack, and last-mile metrics for online and wholesale orders.
  domainKey: supply-chain
  owner: Fulfilment Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 90
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: on_time_delivery
    name: On-time delivery
    definition: Orders delivered within the promised slot, as a share of orders.
    grain: network / week
    unit: percent
    semanticRef: semantic.fulfilment_and_delivery.on_time_delivery
  - key: cost_per_order
    name: Cost per order
    definition: Fully loaded fulfilment cost per delivered order.
    grain: network / month
    unit: currency
    semanticRef: semantic.fulfilment_and_delivery.cost_per_order
- key: returns-and-reverse
  name: Returns & Reverse Logistics
  description: Return rate, reason, and recovery metrics across channels.
  domainKey: ecommerce
  owner: Returns Analytics
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 84
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: return_rate
    name: Return rate
    definition: Units returned as a share of units sold, by category and channel.
    grain: category / month
    unit: percent
