# Telecom pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: telecom
name: Telecom
version: 1.0.0
summary: Subscriber, service, and network element, organised around the experience and churn decisions
  an operator runs on.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: consumer-mobile
  name: Consumer Mobile
- key: fixed-broadband
  name: Fixed Broadband
- key: network-performance
  name: Network Performance
- key: service-assurance
  name: Service Assurance
- key: enterprise-accounts
  name: Enterprise Accounts
conformedBackbone:
- Subscriber
- Account
- Service
- Network Element
- Usage
personas:
- key: retention-manager
  name: Retention Manager
  kind: BUSINESS
  ownedDecisions: Which subscribers get a save offer this cycle, and which are left alone.
  cadence: Weekly
  currentWorkaround: Works a churn propensity list with no view of the network experience behind it.
- key: network-performance-analyst
  name: Network Performance Analyst
  kind: BUSINESS
  ownedDecisions: Which cells are prioritised for optimisation and which faults are escalated.
  cadence: Daily
  currentWorkaround: Reads a performance dashboard and correlates complaints manually.
- key: service-assurance-manager
  name: Service Assurance Manager
  kind: BUSINESS
  ownedDecisions: Which fault classes get engineering attention this sprint.
  cadence: Daily
  currentWorkaround: Reads fault tickets with no view of which faults repeat.
- key: enterprise-account-manager
  name: Enterprise Account Manager
  kind: BUSINESS
  ownedDecisions: Which accounts get a service review and where credits are conceded.
  cadence: Monthly
  currentWorkaround: Assembles an SLA position from tickets the customer already quoted.
- key: device-product-manager
  name: Device Product Manager
  kind: BUSINESS
  ownedDecisions: Which upgrade offers run, and at what subsidy.
  cadence: Monthly
  currentWorkaround: Judges upgrade appetite from last quarter's take-up sheet.
- key: field-installation-lead
  name: Field Installation Lead
  kind: BUSINESS
  ownedDecisions: Where install capacity goes and which jobs are re-scheduled.
  cadence: Daily
  currentWorkaround: Balances an install diary against a provisioning system that lags it.
questionLibrary:
- key: q-churn-risk
  personaKey: retention-manager
  text: Which subscriber segments are most likely to leave this cycle?
  intentClass: forecast
  consequenceOfNoAnswer: Save budget is spent on subscribers who were never going to leave.
  expectedAnswerShape: Segment list with propensity and volume
  metricKey: churn_propensity
- key: q-experience
  personaKey: retention-manager
  text: Which at-risk subscribers are also having a poor network experience?
  intentClass: comparison
  consequenceOfNoAnswer: A discount is offered where a network fix was needed.
  expectedAnswerShape: Subscriber list with propensity and experience index
  metricKey: experience_index
- key: q-why-churn
  personaKey: retention-manager
  text: Why is churn rising in the segments we flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Offers are generic, expensive, and short-lived.
  expectedAnswerShape: Contributing factors ranked by effect
  metricKey: churn_propensity
- key: q-congestion
  personaKey: network-performance-analyst
  text: Which cells are congested most often in the busy hour?
  intentClass: trend
  consequenceOfNoAnswer: Optimisation goes where complaints are loudest rather than where load is.
  expectedAnswerShape: Cell list with congestion rate and change
  metricKey: cell_congestion_rate
- key: q-upgrade-timing
  personaKey: device-product-manager
  text: When in the contract do upgrades actually happen?
  intentClass: trend
  consequenceOfNoAnswer: Offers land months before or after the moment of appetite.
  expectedAnswerShape: Take rate by contract month
  metricKey: upgrade_take_rate
- key: q-credit-exposure
  personaKey: enterprise-account-manager
  text: Which accounts have the largest service-credit exposure?
  intentClass: comparison
  consequenceOfNoAnswer: Credits are conceded without a view of the total.
  expectedAnswerShape: Account list with exposure
  metricKey: sla_attainment
- key: q-fault-volume
  personaKey: service-assurance-manager
  text: Which regions are raising the most faults this week?
  intentClass: lookup
  consequenceOfNoAnswer: Engineering attention follows escalation, not volume.
  expectedAnswerShape: Region list with fault volume
  metricKey: mean_time_to_restore
- key: q-fault-repeat
  personaKey: service-assurance-manager
  text: Which fault classes keep coming back after restoration?
  intentClass: trend
  consequenceOfNoAnswer: The same fault is fixed repeatedly and never resolved.
  expectedAnswerShape: Fault class with repeat rate
  metricKey: repeat_fault_rate
- key: q-restore-time
  personaKey: service-assurance-manager
  text: Where is restoration slowest, and for which class?
  intentClass: comparison
  consequenceOfNoAnswer: Restoration targets are missed in a region nobody is watching.
  expectedAnswerShape: Region list with time to restore
  metricKey: mean_time_to_restore
- key: q-sla-breach
  personaKey: enterprise-account-manager
  text: Which enterprise accounts are closest to an SLA breach?
  intentClass: forecast
  consequenceOfNoAnswer: A credit is conceded before anyone knew it was coming.
  expectedAnswerShape: Account list with SLA position
  metricKey: sla_attainment
- key: q-renewal-risk
  personaKey: enterprise-account-manager
  text: Which contracts are up for renewal with poor service history?
  intentClass: recommendation
  consequenceOfNoAnswer: Renewal conversations start without the service story.
  expectedAnswerShape: Contract list with renewal date
  metricKey: contract_renewal_rate
- key: q-upgrade-appetite
  personaKey: device-product-manager
  text: Which segments are taking up upgrades fastest?
  intentClass: trend
  consequenceOfNoAnswer: Subsidy is spent evenly across uneven appetite.
  expectedAnswerShape: Segment trend with take rate
  metricKey: upgrade_take_rate
- key: q-device-margin
  personaKey: device-product-manager
  text: Where is device margin thinnest after subsidy?
  intentClass: comparison
  consequenceOfNoAnswer: A popular offer turns out to lose money per unit.
  expectedAnswerShape: Device list with margin
  metricKey: device_margin
- key: q-install-first-time
  personaKey: field-installation-lead
  text: Where are installs failing on the first visit?
  intentClass: diagnosis
  consequenceOfNoAnswer: Repeat visits absorb capacity that new orders needed.
  expectedAnswerShape: Region list with first-time-right rate
  metricKey: install_first_time_right
- key: q-provisioning-lag
  personaKey: field-installation-lead
  text: How long are orders taking to reach activation?
  intentClass: trend
  consequenceOfNoAnswer: Order-to-activation is quoted from memory, not measurement.
  expectedAnswerShape: Product trend with lead time
  metricKey: provisioning_lead_time
- key: q-cell-headroom
  personaKey: network-performance-analyst
  text: Which cells run out of capacity first at current growth?
  intentClass: forecast
  consequenceOfNoAnswer: Capacity is added after customers have already felt it.
  expectedAnswerShape: Cell list with months of headroom
  metricKey: capacity_headroom
dataProducts:
- key: subscriber-360
  name: Subscriber 360
  description: Conformed subscriber, service, and usage view with certified churn and experience metrics.
  domainKey: consumer-mobile
  owner: Consumer Analytics
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 92
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: churn_propensity
    name: Churn propensity
    definition: Modelled likelihood a subscriber terminates within ninety days.
    grain: subscriber / month
    unit: score 0-1
    semanticRef: semantic.subscriber_360.churn_propensity
  - key: experience_index
    name: Experience index
    definition: Composite of throughput, latency, and drop rate experienced by a subscriber.
    grain: subscriber / week
    unit: index 0-100
    semanticRef: semantic.subscriber_360.experience_index
- key: network-performance
  name: Network Performance
  description: Certified cell, element, and fault metrics with agreed definitions.
  domainKey: network-performance
  owner: Network Analytics
  contractVersion: 1.4.0
  semanticModelVersion: 1.4.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: cell_congestion_rate
    name: Cell congestion rate
    definition: Share of busy-hour periods where a cell exceeded its utilisation threshold.
    grain: cell / day
    unit: percent
    semanticRef: semantic.network_performance.cell_congestion_rate
- key: service-assurance-360
  name: Service Assurance 360
  description: Fault, restoration, and repeat-issue metrics across consumer and enterprise services.
  domainKey: service-assurance
  owner: Assurance Analytics
  contractVersion: 1.5.0
  semanticModelVersion: 1.5.0
  layer: GOLD
  qualityScore: 91
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: mean_time_to_restore
    name: Mean time to restore
    definition: Hours from fault raised to service restored, by fault class.
    grain: fault class / week
    unit: hours
    semanticRef: semantic.service_assurance_360.mean_time_to_restore
  - key: repeat_fault_rate
    name: Repeat fault rate
    definition: Share of services faulting again within thirty days of restoration.
    grain: region / month
    unit: percent
    semanticRef: semantic.service_assurance_360.repeat_fault_rate
- key: broadband-experience
  name: Broadband Experience
  description: Throughput, latency, and congestion metrics for fixed broadband services.
  domainKey: fixed-broadband
  owner: Network Experience
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 93
  sensitivity: INTERNAL
  freshnessSlaHours: 6
  metrics:
  - key: average_throughput
    name: Average throughput
    definition: Median downstream throughput during peak hours.
    grain: exchange / day
    unit: Mbps
    semanticRef: semantic.broadband_experience.average_throughput
  - key: congestion_hours
    name: Congestion hours
    definition: Hours per week a node exceeds the congestion threshold.
    grain: node / week
    unit: hours
    semanticRef: semantic.broadband_experience.congestion_hours
- key: enterprise-contracts
  name: Enterprise Contracts
  description: SLA attainment, credit exposure, and renewal metrics for enterprise accounts.
  domainKey: enterprise-accounts
  owner: Enterprise Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 90
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: sla_attainment
    name: SLA attainment
    definition: Share of contracted service levels met in the period.
    grain: account / month
    unit: percent
    semanticRef: semantic.enterprise_contracts.sla_attainment
  - key: contract_renewal_rate
    name: Contract renewal rate
    definition: Share of contract value renewed at expiry.
    grain: segment / quarter
    unit: percent
    semanticRef: semantic.enterprise_contracts.contract_renewal_rate
- key: churn-and-retention
  name: Churn & Retention
  description: Disconnection, save, and win-back metrics across consumer subscriptions.
  domainKey: consumer-mobile
  owner: Retention Analytics
  contractVersion: 1.6.0
  semanticModelVersion: 1.6.0
  layer: GOLD
  qualityScore: 92
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: monthly_churn_rate
    name: Monthly churn rate
    definition: Disconnections as a share of the opening subscriber base.
    grain: segment / month
    unit: percent
    semanticRef: semantic.churn_and_retention.monthly_churn_rate
  - key: save_rate
    name: Save rate
    definition: Share of cancellation attempts retained after a save offer.
    grain: segment / month
    unit: percent
    semanticRef: semantic.churn_and_retention.save_rate
- key: device-and-upgrade
  name: Device & Upgrade
  description: Upgrade behaviour, device margin, and trade-in metrics.
  domainKey: consumer-mobile
  owner: Device Analytics
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 87
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: upgrade_take_rate
    name: Upgrade take rate
    definition: Share of eligible subscribers upgrading within the window.
    grain: segment / month
    unit: percent
    semanticRef: semantic.device_and_upgrade.upgrade_take_rate
  - key: device_margin
    name: Device margin
    definition: Margin per device sold after subsidy and trade-in.
    grain: device / month
    unit: currency
    semanticRef: semantic.device_and_upgrade.device_margin
- key: field-installations
  name: Field Installations
  description: Provisioning, appointment, and first-time-right metrics for installs.
  domainKey: service-assurance
  owner: Field Operations
  contractVersion: 1.0.0
  semanticModelVersion: 1.0.0
  layer: GOLD
  qualityScore: 88
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: install_first_time_right
    name: Install first time right
    definition: Installs completed on the first visit with service confirmed working.
    grain: region / week
    unit: percent
    semanticRef: semantic.field_installations.install_first_time_right
  - key: provisioning_lead_time
    name: Provisioning lead time
    definition: Working days from order to service activation.
    grain: product / month
    unit: days
    semanticRef: semantic.field_installations.provisioning_lead_time
- key: spectrum-and-capacity
  name: Spectrum & Capacity
  description: Cell utilisation and capacity headroom metrics used in network planning.
  domainKey: network-performance
  owner: Network Planning
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 94
  sensitivity: INTERNAL
  freshnessSlaHours: 12
  metrics:
  - key: cell_utilisation
    name: Cell utilisation
    definition: Peak-hour resource block utilisation for a cell.
    grain: cell / day
    unit: percent
    semanticRef: semantic.spectrum_and_capacity.cell_utilisation
  - key: capacity_headroom
    name: Capacity headroom
    definition: Forecast months until a cell breaches its capacity threshold.
    grain: cell / month
    unit: months
    semanticRef: semantic.spectrum_and_capacity.capacity_headroom
