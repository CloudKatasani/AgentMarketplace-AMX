  description: Unit economics by product, channel, and segment, reconciled to the ledger.
  domainKey: finance
  owner: Finance Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 91
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 168
  metrics:
  - key: cost_per_transaction
    name: Cost per transaction
    definition: Fully loaded cost per completed transaction, by channel.
