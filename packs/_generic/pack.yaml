# Generic pack — 1.0.0
# Illustrative and editable. Packs change vocabulary and seed content, never logic.

schemaVersion: 1.0.0
key: _generic
name: Generic
version: 1.0.0
summary: Industry-agnostic vocabulary, roles, and constraints. The default for a new organisation, and
  the base every other pack varies from.
disclaimer: This pack is illustrative. Every persona, question, product, and constraint is a starting
  point to edit, not a standard to comply with.
domains:
- key: customer
  name: Customer
- key: finance
  name: Finance
- key: operations
  name: Operations
- key: workforce
  name: Workforce
conformedBackbone:
- Party
- Account
- Product
- Transaction
personas:
- key: operations-analyst
  name: Operations Analyst
  kind: BUSINESS
  ownedDecisions: Which exceptions get worked this week, and which are safe to leave.
  cadence: Weekly, with a daily exception review
  currentWorkaround: Exports two dashboards into a spreadsheet and sorts by hand.
- key: finance-controller
  name: Finance Controller
  kind: BUSINESS
  ownedDecisions: Which variances are investigated before the month closes.
  cadence: Monthly, with a weekly flash review
  currentWorkaround: Waits for the close pack and asks the analyst team follow-up questions.
- key: platform-engineer
  name: Platform Engineer
  kind: IT
  ownedDecisions: Which data quality incidents are escalated and which pipelines are paused.
  cadence: Daily
  currentWorkaround: Reads alert channels and checks freshness manually.
- key: customer-success-lead
  name: Customer Success Lead
  kind: BUSINESS
  ownedDecisions: Which accounts get attention this week and which are left alone.
  cadence: Weekly
  currentWorkaround: Works from a churn list built by hand each Monday.
- key: service-owner
  name: Service Owner
  kind: BUSINESS
  ownedDecisions: Where reliability work goes next.
  cadence: Weekly
  currentWorkaround: Reads incident counts with no view of which service they belong to.
- key: commercial-analyst
  name: Commercial Analyst
  kind: BUSINESS
  ownedDecisions: Which forecast is taken to the board.
  cadence: Monthly
  currentWorkaround: Reconciles a pipeline export against a finance ledger by hand.
- key: compliance-manager
  name: Compliance Manager
  kind: BUSINESS
  ownedDecisions: Which control failures are escalated and which are accepted.
  cadence: Quarterly
  currentWorkaround: Chases control owners by email for evidence.
questionLibrary:
- key: q-exception-volume
  personaKey: operations-analyst
  text: Which exception types grew fastest since last week?
  intentClass: trend
  consequenceOfNoAnswer: The team works the familiar queue while a new failure mode builds up unnoticed.
  expectedAnswerShape: Ranked exception types with change versus prior week
  metricKey: exception_rate
- key: q-exception-cause
  personaKey: operations-analyst
  text: Why did exceptions rise in the accounts we already flagged?
  intentClass: diagnosis
  consequenceOfNoAnswer: Fixes are generic, so the same exceptions come back next cycle.
  expectedAnswerShape: Contributing factors ranked by effect, each traceable to a metric
  metricKey: exception_rate
- key: q-variance
  personaKey: finance-controller
  text: Which cost lines are furthest from plan this period?
  intentClass: comparison
  consequenceOfNoAnswer: The close is late because the variance hunt starts from scratch every month.
  expectedAnswerShape: Cost lines with variance to plan and direction of travel
  metricKey: budget_variance
- key: q-freshness
  personaKey: platform-engineer
  text: Which data products are outside their freshness SLA right now?
  intentClass: lookup
  consequenceOfNoAnswer: Consumers find out from a wrong number rather than from us.
  expectedAnswerShape: Product list with hours since refresh against SLA
  metricKey: freshness_breach_count
- key: q-control-trend
  personaKey: compliance-manager
  text: How is control pass rate moving by framework?
  intentClass: trend
  consequenceOfNoAnswer: Control health is asserted rather than shown.
  expectedAnswerShape: Framework trend with pass rate
  metricKey: control_pass_rate
- key: q-incident-trend
  personaKey: service-owner
  text: How is the incident rate moving month on month?
  intentClass: trend
  consequenceOfNoAnswer: A slow degradation is only visible in hindsight.
  expectedAnswerShape: Service trend with incident rate
  metricKey: incident_rate
- key: q-customer-trend
  personaKey: customer-success-lead
  text: How is the active customer base trending?
  intentClass: trend
  consequenceOfNoAnswer: Growth is reported from contracts rather than usage.
  expectedAnswerShape: Active count trend by segment
  metricKey: active_customers
- key: q-active-customers
  personaKey: customer-success-lead
  text: How many customers are actually active this month?
  intentClass: lookup
  consequenceOfNoAnswer: Reporting counts contracts rather than usage.
  expectedAnswerShape: Active count by segment
  metricKey: active_customers
- key: q-churn-where
  personaKey: customer-success-lead
  text: Where is churn concentrated?
  intentClass: comparison
  consequenceOfNoAnswer: Retention effort spreads evenly across uneven risk.
  expectedAnswerShape: Segment list with churn rate
  metricKey: customer_churn_rate
- key: q-sla-attainment
  personaKey: service-owner
  text: Which services are missing their service levels?
  intentClass: lookup
  consequenceOfNoAnswer: A missed level is reported after the customer noticed.
  expectedAnswerShape: Service list with attainment
  metricKey: sla_attainment
- key: q-incident-drivers
  personaKey: service-owner
  text: Which services generate the most incidents per transaction?
  intentClass: comparison
  consequenceOfNoAnswer: Reliability work goes to the loudest service, not the worst.
  expectedAnswerShape: Service list with incident rate
  metricKey: incident_rate
- key: q-forecast-accuracy
  personaKey: commercial-analyst
  text: How accurate has the forecast been by segment?
  intentClass: trend
  consequenceOfNoAnswer: The same optimistic segment is believed every quarter.
  expectedAnswerShape: Segment trend with error
  metricKey: forecast_accuracy
- key: q-pipeline-conversion
  personaKey: commercial-analyst
  text: Where is pipeline converting best?
  intentClass: comparison
  consequenceOfNoAnswer: Capacity is planned against a pipeline nobody weighted.
  expectedAnswerShape: Segment list with conversion
  metricKey: pipeline_conversion
- key: q-control-failures
  personaKey: compliance-manager
  text: Which controls failed testing this quarter?
  intentClass: lookup
  consequenceOfNoAnswer: Committee hears about a failure at the same time as the regulator.
  expectedAnswerShape: Control list with test result
  metricKey: control_pass_rate
- key: q-overdue-actions
  personaKey: compliance-manager
  text: Which remediation actions are overdue?
  intentClass: trend
  consequenceOfNoAnswer: An overdue action ages quietly until it is an incident.
  expectedAnswerShape: Action list with days overdue
  metricKey: overdue_actions
- key: q-cost-per-transaction
  personaKey: finance-controller
  text: Where is cost per transaction highest?
  intentClass: comparison
  consequenceOfNoAnswer: Cost is managed as one total rather than where it is made.
  expectedAnswerShape: Channel list with unit cost
  metricKey: cost_per_transaction
dataProducts:
- key: operations-360
  name: Operations 360
  description: Conformed operational view across parties, accounts, and transactions, with certified exception
    metrics.
  domainKey: operations
  owner: Operations Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 90
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: exception_rate
    name: Exception rate
    definition: Share of transactions raising an exception in a rolling seven-day window.
    grain: exception type / day
    unit: percent
    semanticRef: semantic.operations_360.exception_rate
  - key: freshness_breach_count
    name: Freshness breaches
    definition: Count of data products past their stated freshness SLA at the time of measurement.
    grain: product / hour
    unit: count
    semanticRef: semantic.operations_360.freshness_breach_count
- key: finance-plan-actuals
  name: Plan vs Actuals
  description: Certified budget, forecast, and actuals by cost line and cost centre.
  domainKey: finance
  owner: Financial Planning
  contractVersion: 2.0.0
  semanticModelVersion: 2.0.0
  layer: GOLD
  qualityScore: 93
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 48
  metrics:
  - key: budget_variance
    name: Budget variance
    definition: Actual less plan for a cost line in the current period, signed so positive is overspend.
    grain: cost line / period
    unit: currency
    semanticRef: semantic.plan_actuals.budget_variance
- key: customer-360
  name: Customer 360
  description: Conformed customer view with certified activity, retention, and value metrics.
  domainKey: customer
  owner: Customer Analytics
  contractVersion: 1.2.0
  semanticModelVersion: 1.2.0
  layer: GOLD
  qualityScore: 90
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: active_customers
    name: Active customers
    definition: Customers with a qualifying interaction in the trailing ninety days.
    grain: segment / month
    unit: count
    semanticRef: semantic.customer_360.active_customers
  - key: customer_churn_rate
    name: Customer churn rate
    definition: Share of active customers who lapse in the period.
    grain: segment / month
    unit: percent
    semanticRef: semantic.customer_360.customer_churn_rate
- key: workforce-capacity
  name: Workforce Capacity
  description: Utilisation, attrition, and capacity metrics for delivery teams.
  domainKey: workforce
  owner: People Analytics
  contractVersion: 1.1.0
  semanticModelVersion: 1.1.0
  layer: GOLD
  qualityScore: 87
  sensitivity: CONFIDENTIAL
  freshnessSlaHours: 24
  metrics:
  - key: utilisation_rate
    name: Utilisation rate
    definition: Billable or productive hours as a share of available hours.
    grain: team / month
    unit: percent
    semanticRef: semantic.workforce_capacity.utilisation_rate
  - key: attrition_rate
    name: Attrition rate
    definition: Leavers as a share of average headcount, annualised.
    grain: team / quarter
    unit: percent
    semanticRef: semantic.workforce_capacity.attrition_rate
- key: service-quality
  name: Service Quality
  description: Service level, incident, and resolution metrics across operational services.
  domainKey: operations
  owner: Service Management
  contractVersion: 1.3.0
  semanticModelVersion: 1.3.0
  layer: GOLD
  qualityScore: 89
  sensitivity: INTERNAL
  freshnessSlaHours: 24
  metrics:
  - key: sla_attainment
    name: SLA attainment
    definition: Share of service levels met in the period.
    grain: service / month
    unit: percent
    semanticRef: semantic.service_quality.sla_attainment
  - key: incident_rate
    name: Incident rate
    definition: Incidents raised per thousand transactions.
    grain: service / month
    unit: rate
    semanticRef: semantic.service_quality.incident_rate
- key: cost-to-serve
